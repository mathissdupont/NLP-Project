name: Hata / araştırma tutarsızlığı
description: Kod, etiket, veri sızıntısı veya sonuç tutarsızlığı bildir.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Yeniden üretme
      description: Komut, veri/config/run kimlikleri ve ilgili örnek ID'leri.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen ve gözlenen sonuç
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Etki ve engellenen işler
      description: Hangi issue, deney, tablo veya sonuç bu hatadan etkileniyor? Native blocking ilişkisini de ekle.
    validations:
      required: true
